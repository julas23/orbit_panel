# Orbit Panel example configuration.
# Copy to ~/.config/orbit/config.yaml. Every key is optional.

# User stylesheet, relative to this file. Reloaded live on change.
style: style.css

panel:
  edge: left        # top | bottom | left | right
  size: 150         # thickness in logical pixels
  monitor: 0
  reserve: true     # keep tiled windows out of the panel's area
  menu:
    command: rofi -show drun
    icon: start-here    # icon name or path to an image
    tooltip: Applications

dock:
  edge: top
  size: 36
  monitor: 0
  reserve: true
  align: end        # start | center | end
  icon_size: 24
  apps:
    # A desktop file by id (looked up in the XDG application dirs)...
    - desktop: firefox.desktop
      group: web
    # ...or by path...
    - desktop: ~/.local/share/applications/thunderbird.desktop
      group: web
    # ...or fully explicit. Explicit fields override the desktop file.
    - name: Terminal
      exec: kitty
      icon: utilities-terminal
      group: system
    # Hidden entries stay in the list but are not shown.
    - desktop: org.gnome.Calculator.desktop
      group: system
      show: false
